<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
        #chat-container { width: 400px; margin-top: 20px; border: 1px solid #ccc; padding: 10px; border-radius: 8px; }
        
        #messages { 
            height: 200px; 
            overflow-y: scroll; 
            border-bottom: 1px solid #eee; 
            margin-bottom: 10px; 
            padding: 5px; 
            white-space: pre-wrap; 
            word-wrap: break-word;
        }

        .msg { margin-bottom: 8px; font-size: 14px; line-height: 1.4; }
        .msg b { color: #555; }

        #chat-form { display: flex; flex-direction: column; gap: 5px; }
        #username { padding: 5px; }
        
        #messageInput { 
            padding: 8px; 
            height: 50px; 
            resize: none; 
            font-family: sans-serif;
        }
        
        input[type="submit"] { padding: 8px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
        input[type="submit"]:hover { background: #218838; }
    </style>
</head>
<body>

    <div id="sketch-holder"></div>

    <div id="chat-container">
        <div id="messages"></div>
        <form id="chat-form">
            <input type="text" id="username" placeholder="Name">
            <textarea id="messageInput" placeholder="Type a message..."></textarea>
            <input type="submit" value="Send">
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('username');

        function sendMessage(e) {
            if (e) e.preventDefault(); 
            const user = usernameInput.value || "Anonymous";
            const text = messageInput.value;

            if (text.trim() !== "") {
                push(messagesRef, { username: user, message: text });
                messageInput.value = ""; 
            }
        }

        chatForm.onsubmit = sendMessage;

        // The specific change requested:
        messageInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (!e.ctrlKey) {
                    // If ONLY Enter is pressed: Send
                    e.preventDefault(); 
                    sendMessage();
                } 
                // If Ctrl + Enter is pressed: Do nothing (allows default new line)
            }
        });

        const messagesDiv = document.getElementById('messages');
        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const el = document.createElement('div');
            el.className = "msg";
            el.innerHTML = `<b>${msg.username}:</b> ${msg.message}`;
            messagesDiv.appendChild(el);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; 
        });
    </script>

    <script src="sketch.js"></script>
</body>
