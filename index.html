<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; background: #f4f4f4; }
        #sketch-holder { margin-top: 20px; border: 2px solid #333; line-height: 0; }
        
        #chat-container { width: 400px; margin: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; background: white; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        #messages { 
            height: 250px; 
            overflow-y: auto; 
            border-bottom: 1px solid #eee; 
            margin-bottom: 10px; 
            padding: 5px;
            /* This line is crucial for showing line breaks in the chat */
            white-space: pre-wrap; 
            word-wrap: break-word;
        }
        
        .msg { margin-bottom: 10px; font-size: 14px; line-height: 1.4; }
        .msg b { color: #2c3e50; display: block; font-size: 12px; text-transform: uppercase; }

        form { display: flex; flex-direction: column; gap: 8px; }
        input[type="text"], textarea { padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-family: inherit; }
        
        textarea { resize: vertical; min-height: 50px; }
        
        input[type="submit"] { 
            background: #4CAF50; 
            color: white; 
            border: none; 
            padding: 10px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold;
        }
        input[type="submit"]:hover { background: #45a049; }
    </style>
</head>
<body>

    <div id="sketch-holder"></div>

    <div id="chat-container">
        <div id="messages"></div>
        
        <!-- Updated to use a proper form -->
        <form id="chat-form">
            <input type="text" id="username" placeholder="Your Name" required>
            
            <!-- Changed to textarea for multi-line support -->
            <textarea id="messageInput" placeholder="Type a message... (Ctrl+Enter for new line, Enter to send)"></textarea>
            
            <input type="submit" value="Send Message">
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // PASTE YOUR FIREBASE CONFIG HERE
       


        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('username');
        const messagesDiv = document.getElementById('messages');

        // Logic to handle sending messages
        function sendMessage() {
            const user = usernameInput.value || "Anonymous";
            const text = messageInput.value;
            
            if (text.trim() !== "") {
                push(messagesRef, { 
                    username: user, 
                    message: text,
                    timestamp: Date.now() 
                });
                messageInput.value = ""; // Clear input
            }
        }

        // Handle Form Submit
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevents page from refreshing
            sendMessage();
        });

        // Handle Keyboard Shortcuts (Enter vs Ctrl+Enter)
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (e.ctrlKey) {
                    // If Ctrl is held, allow a standard newline
                    // The textarea does this by default, so we just let it happen
                } else {
                    // If Ctrl is NOT held, prevent the newline and send the message
                    e.preventDefault(); 
                    sendMessage();
                }
            }
        });

        // Listen for live updates
        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const el = document.createElement('div');
            el.className = "msg";
            // Sanitize input slightly to prevent HTML injection
            el.innerHTML = `<b>${msg.username}</b>${msg.message}`;
            messagesDiv.appendChild(el);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; 
        });
    </script>

    <script src="sketch.js"></script>
</body>
</html>
