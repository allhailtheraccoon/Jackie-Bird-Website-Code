<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
        #chat-container { width: 400px; margin-top: 20px; border: 1px solid #ccc; padding: 10px; border-radius: 8px; }
        #messages { height: 200px; overflow-y: scroll; border-bottom: 1px solid #eee; margin-bottom: 10px; padding: 5px; }
        .msg { margin-bottom: 5px; font-size: 14px; }
        .msg b { color: #555; }
        input { width: 70%; padding: 5px; }
        button { width: 25%; padding: 5px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- This is where your sketch will be -->
    <div id="sketch-holder"></div>

    <div id="chat-container">
        <div id="messages"></div>
        <input type="text" id="username" placeholder="Name">
        <input type="text" id="messageInput" placeholder="Type a message...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const messagesRef = ref(db, 'messages');

        // Function to send message
        window.sendMessage = function() {
            const user = document.getElementById('username').value || "Anonymous";
            const text = document.getElementById('messageInput').value;
            if (text.trim() !== "") {
                push(messagesRef, { username: user, message: text });
                document.getElementById('messageInput').value = "";
            }
        }

        // Listen for live updates
        const messagesDiv = document.getElementById('messages');
        onChildAdded(messagesRef, (data) => {
            const msg = data.val();
            const el = document.createElement('div');
            el.className = "msg";
            el.innerHTML = `<b>${msg.username}:</b> ${msg.message}`;
            messagesDiv.appendChild(el);
            messagesDiv.scrollTop = messagesDiv.scrollHeight; // Auto-scroll to bottom
        });
    </script>

    <script src="sketch.js"></script>
</body>
</html>
