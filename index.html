<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; }
    #chat-container { width: 400px; margin-top: 20px; border: 1px solid #ccc; padding: 10px; border-radius: 8px; }
    
    #messages { 
        height: 200px; 
        overflow-y: scroll; 
        border-bottom: 1px solid #eee; 
        margin-bottom: 10px; 
        padding: 5px; 
        /* This line ensures line breaks (\n) actually show up as new lines in HTML */
        white-space: pre-wrap; 
        word-wrap: break-word;
    }

    .msg { margin-bottom: 8px; font-size: 14px; line-height: 1.4; }
    .msg b { color: #555; }

    #chat-form { display: flex; flex-direction: column; gap: 5px; }
    #username { padding: 5px; }
    
    /* Style the textarea to look like a chat box */
    #messageInput { 
        padding: 8px; 
        height: 50px; 
        resize: none; 
        font-family: sans-serif;
    }
    
    input[type="submit"] { padding: 8px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
    input[type="submit"]:hover { background: #218838; }
</style>
</head>
<body>

    <!-- This is where your sketch will be -->
    <div id="sketch-holder"></div>

   <div id="chat-container">
    <div id="messages"></div>
    
    <!-- Use a real form with onsubmit -->
    <form id="chat-form">
        <input type="text" id="username" placeholder="Name">
        <!-- Textarea allows for multiple lines -->
        <textarea id="messageInput" placeholder="Type a message..."></textarea>
            <input type="submit" value="Send">
        </form>
    </div>

   <script type="module">
    // ... (Keep your existing Firebase imports and Config here) ...

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const messagesRef = ref(db, 'messages');

    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('messageInput');
    const usernameInput = document.getElementById('username');

    // Updated sendMessage function
    function sendMessage(e) {
        if (e) e.preventDefault(); // Prevents the page from reloading

        const user = usernameInput.value || "Anonymous";
        const text = messageInput.value;

        if (text.trim() !== "") {
            push(messagesRef, { 
                username: user, 
                message: text 
            });
            messageInput.value = ""; // Clear the box
        }
    }

    // Attach the submit event to the form
    chatForm.onsubmit = sendMessage;

    // Handle Keyboard Shortcuts
    messageInput.addEventListener('keydown', function(e) {
        // If "Enter" is pressed
        if (e.key === 'Enter') {
            // If Ctrl and Shift are NOT held down, send the message
            if (!e.ctrlKey) {
                e.preventDefault(); // Don't make a new line
                sendMessage();      // Run the send function
            } 
            // If Ctrl + Shift + Enter are held, allow the default (new line)
        }
    });

    // ... (Keep your existing onChildAdded listener below) ...
</script>
    <script src="sketch.js"></script>
</body>
</html>
